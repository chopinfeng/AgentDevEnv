  <h1>AgentDevEnv 系统架构</h1>
  <p class="subtitle">边缘执行（Workers + Durable Objects），沙箱承接重任务并以阿里云兜底；线上 trace 归档喂给离线进化管线，产物以 PR 回写 GitHub，经 CI 审批部署回边缘 —— 执行与进化分离的闭环。</p>
