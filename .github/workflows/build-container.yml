name: Build Container

# 构建 heavy-runner 镜像并推到 GHCR。
#
# 这一步跑在 GitHub 托管 runner 上，不碰任何私有网络 —— 因此
# 公开仓库也安全。部署到哪台机器由目标机自己决定（见 deploy/pull-agent.sh）。
#
# 认证用内置的 GITHUB_TOKEN，不需要存长期密钥。

on:
  push:
    branches: [main]
    paths:
      - "apps/heavy-runner/**"
      - ".github/workflows/build-container.yml"
  release:
    types: [published]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/heavy-runner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write            # 推 GHCR 所需的最小权限

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # main 分支推 edge，release 推语义化版本 —— 目标机按 tag 决定拉哪个
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: apps/heavy-runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "目标机会自行拉取，无需 CI 连入内网。" >> "$GITHUB_STEP_SUMMARY"
